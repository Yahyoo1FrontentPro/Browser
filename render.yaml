services:
  - type: web
    name: aura-nexus-dashboard
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aura-nexus-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OWNER_ID
        value: "SUPER_ADMIN_777"

  - type: worker
    name: aura-nexus-log-worker
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aura-nexus-db
          property: connectionString

databases:
  - name: aura-nexus-db
    plan: starter
